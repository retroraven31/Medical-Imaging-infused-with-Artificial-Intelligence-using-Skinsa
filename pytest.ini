[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: quick CPU-only smoke tests on synthetic data
    fidelity: architecture fidelity tests (parameter counts, TTA math)
    integration: requires real HAM10000 dataset
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
